<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Registro SPID - Metadata</title>

<style>
body { font-family: Arial; margin: 2em; background:#f4f6f9; }
h1 { color:#2c3e50; }
.badge { padding:6px 12px; border-radius:20px; color:white; font-weight:bold; }
.green { background:#27ae60; }
.red { background:#c0392b; }
.gray { background:#7f8c8d; }
table { border-collapse: collapse; width:100%; margin-top:1em; }
th, td { padding:10px; border:1px solid #ddd; }
th { background:#34495e; color:white; }
.valid { color:#27ae60; font-weight:bold; }
.invalid { color:#c0392b; font-weight:bold; }
</style>

</head>
<body>

<h1>Registro SPID - Metadata</h1>

<div>
<span class="badge green">Validi: {{VALID}}</span>
<span class="badge red">Non validi: {{INVALID}}</span>
<span class="badge gray">Totale: {{TOTAL}}</span>
</div>

<p><a href="report.log">📄 Scarica il report completo</a></p>

<table>
<thead>
<tr>
<th>Nome file</th>
<th>Stato</th>
<th>Ultima validazione</th>
</tr>
</thead>
<tbody>
{{ROWS}}
</tbody>
</table>

</body>
</html>
