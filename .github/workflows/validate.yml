name: Validate SPID Metadata

on:
  push:
    paths:
      - "metadata/**.xml"
  pull_request:
    paths:
      - "metadata/**.xml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install lxml xmlsec cryptography

      - name: Run metadata validation
        run: |
          mkdir -p validated reports .gh-pages-tmp
          echo "=== Validation Report ===" > reports/report.log
          set +e   # non fermarti al primo errore
          VALID=0
          INVALID=0
          for f in metadata/*.xml; do
            echo "🔎 Validating $f"
            if python scripts/validate_metadata_qad.py "$f" >> reports/report.log 2>&1; then
              echo "✅ $f is valid"
              echo "[$(date)] VALID: $(basename $f)" >> reports/report.log
              cp "$f" validated/
              VALID=$((VALID+1))
            else
              echo "❌ $f has errors"
              echo "[$(date)] INVALID: $(basename $f)" >> reports/report.log
              INVALID=$((INVALID+1))
            fi
          done
          TOTAL=$((VALID+INVALID))
          echo "" >> reports/report.log
          echo "=== SUMMARY ===" >> reports/report.log
          echo "Valid metadata:   $VALID" >> reports/report.log
          echo "Invalid metadata: $INVALID" >> reports/report.log
          echo "Total processed:  $TOTAL" >> reports/report.log
          # Salva numeri in file temporanei per index.html
          echo "$VALID" > .gh-pages-tmp/valid_count
          echo "$INVALID" > .gh-pages-tmp/invalid_count
          echo "$TOTAL" > .gh-pages-tmp/total_count

      - name: Generate index.html
        run: |
          VALID=$(cat .gh-pages-tmp/valid_count)
          INVALID=$(cat .gh-pages-tmp/invalid_count)
          TOTAL=$(cat .gh-pages-tmp/total_count)

          cat > gh-pages_index.html <<EOF
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Registro SPID - Metadata</title>

<style>
body { font-family: Arial; margin: 2em; background:#f4f6f9; }
h1 { color:#2c3e50; }
.badge { padding:6px 12px; border-radius:20px; color:white; font-weight:bold; }
.green { background:#27ae60; }
.red { background:#c0392b; }
.gray { background:#7f8c8d; }
table { border-collapse: collapse; width:100%; margin-top:1em; }
th, td { padding:10px; border:1px solid #ddd; }
th { background:#34495e; color:white; cursor:pointer; }
tr:nth-child(even) { background:#ecf0f1; }
.valid { color:#27ae60; font-weight:bold; }
.invalid { color:#c0392b; font-weight:bold; }
.controls { margin:1em 0; }
input, select { padding:8px; margin-right:10px; }
.footer { margin-top:2em; font-size:0.9em; color:#777; }
</style>

<script>
function filterTable() {
  let input = document.getElementById("searchBox").value.toLowerCase();
  let showValidOnly = document.getElementById("onlyValid").checked;
  let rows = document.querySelectorAll("#metadataTable tbody tr");

  rows.forEach(row => {
    let text = row.textContent.toLowerCase();
    let isValid = row.dataset.status === "valid";

    let matchSearch = text.includes(input);
    let matchValid = !showValidOnly || isValid;

    row.style.display = (matchSearch && matchValid) ? "" : "none";
  });
}

function sortTable(col) {
  let table = document.getElementById("metadataTable");
  let rows = Array.from(table.rows).slice(1);
  let asc = table.dataset.sortDir !== "asc";
  table.dataset.sortDir = asc ? "asc" : "desc";

  rows.sort((a,b)=>{
    let x = a.cells[col].innerText.toLowerCase();
    let y = b.cells[col].innerText.toLowerCase();
    return asc ? x.localeCompare(y) : y.localeCompare(x);
  });

  rows.forEach(r => table.tBodies[0].appendChild(r));
}
</script>
</head>
<body>

<h1>Registro SPID - Metadata</h1>

<div>
<span class="badge green">Validi: $VALID</span>
<span class="badge red">Non validi: $INVALID</span>
<span class="badge gray">Totale: $TOTAL</span>
</div>

<p><a href="report.log">📄 Scarica il report completo</a></p>

<div class="controls">
<input type="text" id="searchBox" onkeyup="filterTable()" placeholder="🔍 Cerca metadata...">
<label>
<input type="checkbox" id="onlyValid" onchange="filterTable()">
 Mostra solo validi
</label>
</div>

<table id="metadataTable">
<thead>
<tr>
<th onclick="sortTable(0)">Nome file</th>
<th onclick="sortTable(1)">Stato</th>
<th onclick="sortTable(2)">Ultima validazione</th>
</tr>
</thead>
<tbody>
EOF

          DATE=$(date +"%Y-%m-%d")

          for f in metadata/*.xml; do
            BASENAME=$(basename "$f")
            if [ -f validated/"$BASENAME" ]; then
              STATUS="<span class='valid'>Valido</span>"
              LINK="<a href=\"validated/$BASENAME\">$BASENAME</a>"
              DATA_STATUS="valid"
            else
              STATUS="<span class='invalid'>Non valido</span>"
              LINK="$BASENAME"
              DATA_STATUS="invalid"
            fi
            echo "<tr data-status=\"$DATA_STATUS\"><td>$LINK</td><td>$STATUS</td><td>$DATE</td></tr>" >> gh-pages_index.html
          done

          cat >> gh-pages_index.html <<'EOF'
</tbody>
</table>

<div class="footer">
Generato automaticamente da GitHub Actions → branch gh-pages
</div>

</body>
</html>
EOF

          cp -r validated reports gh-pages_index.html .gh-pages-tmp/
      


      - name: Setup Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy validated metadata to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf .publish
          git fetch origin gh-pages || true
          git worktree add .publish gh-pages || git worktree add .publish -b gh-pages origin/gh-pages

          # Copia i file generati
          cp -r .gh-pages-tmp/* .publish/

          # 👇 Copia anche TUTTI i metadata originali
          mkdir -p .publish/metadata
          cp metadata/*.xml .publish/metadata/ 2>/dev/null || echo "⚠️ Nessun metadata sorgente trovato"

          # ⚠️ Forza index.html aggiornato
          cp .gh-pages-tmp/gh-pages_index.html .publish/index.html

          # Commit e push
          cd .publish
          touch .nojekyll
          git add .
          git commit -m "Update validated metadata [skip ci]" || echo "No changes to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} gh-pages
          cd ..
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



