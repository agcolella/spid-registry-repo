name: Validate SPID Metadata

on:
  push:
    paths:
      - "metadata/**.xml"
  pull_request:
    paths:
      - "metadata/**.xml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install lxml xmlsec cryptography

      - name: Run metadata validation
        run: |
          mkdir -p validated reports .gh-pages-tmp
          echo "=== Validation Report ===" > reports/report.log
          set +e   # non fermarti al primo errore
          VALID=0
          INVALID=0
          for f in metadata/*.xml; do
            echo "🔎 Validating $f"
            if python scripts/validate_metadata_qad.py "$f" >> reports/report.log 2>&1; then
              echo "✅ $f is valid"
              echo "[$(date)] VALID: $(basename $f)" >> reports/report.log
              cp "$f" validated/
              VALID=$((VALID+1))
            else
              echo "❌ $f has errors"
              echo "[$(date)] INVALID: $(basename $f)" >> reports/report.log
              INVALID=$((INVALID+1))
            fi
          done
          TOTAL=$((VALID+INVALID))
          echo "" >> reports/report.log
          echo "=== SUMMARY ===" >> reports/report.log
          echo "Valid metadata:   $VALID" >> reports/report.log
          echo "Invalid metadata: $INVALID" >> reports/report.log
          echo "Total processed:  $TOTAL" >> reports/report.log
          # Salva numeri in file temporanei per index.html
          echo "$VALID" > .gh-pages-tmp/valid_count
          echo "$INVALID" > .gh-pages-tmp/invalid_count
          echo "$TOTAL" > .gh-pages-tmp/total_count


      - name: Generate index.html
        run: |
          VALID=$(cat .gh-pages-tmp/valid_count)
          INVALID=$(cat .gh-pages-tmp/invalid_count)
          TOTAL=$(cat .gh-pages-tmp/total_count)

          cat > gh-pages_index.html <<EOF
          <!DOCTYPE html>
          <html lang="it">
          <head>
            <meta charset="UTF-8">
            <title>Registro SPID - Metadata Validati</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 2em; background: #f9f9f9; }
              h1 { color: #2c3e50; }
              table { border-collapse: collapse; width: 100%; margin-top: 1em; }
              th, td { padding: 8px 12px; border: 1px solid #ccc; }
              th { background: #34495e; color: #fff; text-align: left; }
              tr:nth-child(even) { background: #ecf0f1; }
              .footer { margin-top: 2em; font-size: 0.9em; color: #777; }
              #searchBox { margin: 1em 0; padding: 8px; width: 100%; max-width: 400px; }
              .valid { color: green; font-weight: bold; }
              .invalid { color: red; font-weight: bold; }
            </style>
            <script>
              function searchTable() {
                let input = document.getElementById("searchBox").value.toLowerCase();
                let rows = document.querySelectorAll("#metadataTable tbody tr");
                rows.forEach(row => {
                  let filename = row.cells[0].textContent.toLowerCase();
                  let status = row.cells[1].textContent.toLowerCase();
                  let date = row.cells[2].textContent.toLowerCase();
                  row.style.display = (filename.includes(input) || status.includes(input) || date.includes(input)) ? "" : "none";
                });
              }
            </script>
          </head>
          <body>
            <h1>Registro SPID - Metadata ✅❌</h1>
            <p>Questa pagina elenca tutti i metadata presenti e il risultato dell’ultima validazione.</p>

            <h2>Riepilogo validazione</h2>
            <table>
              <tr><th>Validi</th><td>$VALID</td></tr>
              <tr><th>Invalidi</th><td>$INVALID</td></tr>
              <tr><th>Totali</th><td>$TOTAL</td></tr>
            </table>

            <p><a href="report.log">📄 Scarica il report completo</a></p>

            <h2>Metadata disponibili</h2>
            <input type="text" id="searchBox" onkeyup="searchTable()" placeholder="🔍 Cerca per nome, stato o data...">

            <table id="metadataTable">
              <thead>
                <tr>
                  <th>Nome file</th>
                  <th>Stato</th>
                  <th>Ultima validazione</th>
                </tr>
              </thead>
              <tbody>
          EOF

          DATE=$(date +"%Y-%m-%d")

          for f in metadata/*.xml; do
            BASENAME=$(basename "$f")
            if [ -f validated/"$BASENAME" ]; then
              STATUS="<span class='valid'>OK</span>"
              LINK="validated/$BASENAME"
            else
              STATUS="<span class='invalid'>KO</span>"
              LINK="metadata/$BASENAME"
            fi
            echo "<tr><td><a href=\"$LINK\">$BASENAME</a></td><td>$STATUS</td><td>$DATE</td></tr>" >> gh-pages_index.html
          done

          cat >> gh-pages_index.html <<'EOF'
              </tbody>
            </table>

            <div class="footer">
              Generato automaticamente dal workflow GitHub Actions →
              <code>gh-pages</code>
            </div>
          </body>
          </html>
          EOF

          cp -r validated reports gh-pages_index.html .gh-pages-tmp/





      


      - name: Setup Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy validated metadata to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf .publish
          git fetch origin gh-pages || true
          git worktree add .publish gh-pages || git worktree add .publish -b gh-pages origin/gh-pages

          # Copia i file generati
          cp -r .gh-pages-tmp/* .publish/

          # 👇 Copia anche TUTTI i metadata originali
          mkdir -p .publish/metadata
          cp metadata/*.xml .publish/metadata/ 2>/dev/null || echo "⚠️ Nessun metadata sorgente trovato"

          # ⚠️ Forza index.html aggiornato
          cp .gh-pages-tmp/gh-pages_index.html .publish/index.html

          # Commit e push
          cd .publish
          touch .nojekyll
          git add .
          git commit -m "Update validated metadata [skip ci]" || echo "No changes to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} gh-pages
          cd ..
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



